# Ejemplo de GitHub Actions para regenerar el sitemap periodicamente
# y commitear el resultado (o publicarlo como artifact / desplegarlo).
#
# Copiar a .github/workflows/sitemap.yml en el repo del SITIO (no en este repo
# generador), ajustando rutas si el generador vive como submodulo o dependencia.

name: Generate sitemap

on:
  schedule:
    - cron: '0 3 * * *' # cada dia a las 03:00 UTC
  workflow_dispatch: {} # permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar sitemap
        run: node bin/sitemap-generator.js --config sitemap.config.js --verbose

      - name: Commit si hubo cambios
        run: |
          git config user.name "sitemap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap*.xml sitemap*.txt robots.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: actualizar sitemap"
          git push
